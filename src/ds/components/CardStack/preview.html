<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CardStack</title>
<style>

  .pv .tpl-reasons--stack .tpl-reason { min-height: 360px; }
</style>
</head>
<body>
<div class="pv">
  <div class="tpl-container">
    <div class="tpl-section-head">
      <h2 class="tpl-h2">Why partners choose us</h2>
      <p class="tpl-lead tpl-muted">Four things a customer can count on, on every job. Scroll this card to see the pile.</p>
    </div>
    <!-- @include sections/reasons.html modifier=" tpl-reasons--stack" attrs="" -->
  </div>
</div>
</body>
</html>
