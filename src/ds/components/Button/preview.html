<!-- @dsCard group="Actions" height=300 subtitle="Primary once per view; text on the accent is always on-accent" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
<style>
  .pv { display: flex; flex-direction: column; gap: var(--space-5); padding: var(--space-6); }
  .pv__row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3) var(--space-4); }
  .pv__photo { padding: var(--space-5); background: var(--neutral-1000); }
</style>
</head>
<body>
<div class="pv">
  <div class="pv__row">
    <a class="tpl-btn tpl-btn--primary" href="#quote">Request a quote</a>
    <a class="tpl-btn tpl-btn--secondary" href="#services">Our services</a>
    <a class="tpl-btn tpl-btn--ghost" href="#roles">View open roles<svg class="tpl-icon tpl-icon--trail" data-tpl-icon="arrow-right"></svg></a>
  </div>
  <div class="pv__row">
    <a class="tpl-btn tpl-btn--primary tpl-btn--lg" href="#quote">Request a quote<svg class="tpl-icon tpl-icon--trail" data-tpl-icon="arrow-right"></svg></a>
    <a class="tpl-btn tpl-btn--primary tpl-btn--sm" href="#quote">Request a quote</a>
    <button class="tpl-btn tpl-btn--primary" type="button" aria-busy="true"><svg class="tpl-icon tpl-icon--spin" data-tpl-icon="loader-2"></svg>Sending</button>
    <button class="tpl-btn tpl-btn--secondary" type="button" aria-disabled="true">Start an inquiry</button>
  </div>
  <div class="pv__row pv__photo">
    <a class="tpl-btn tpl-btn--primary" href="#quote">Request a quote</a>
    <a class="tpl-btn tpl-btn--on-photo" href="tel:+15550100100"><svg class="tpl-icon" data-tpl-icon="phone"></svg>Call (555) 010-0100</a>
  </div>
  <div class="pv__row" data-for-theme="kinetic" hidden>
    <a class="tpl-btn tpl-btn--primary tpl-btn--lg tpl-btn--orb" href="#quote" data-tpl-magnetic>Request a quote<svg class="tpl-icon tpl-icon--trail" data-tpl-icon="arrow-up-right"></svg></a>
    <a class="tpl-btn tpl-btn--secondary tpl-btn--lg" href="#services" data-tpl-magnetic>Our services</a>
    <span class="tpl-small tpl-muted">Orb and magnetic hover (Kinetic)</span>
  </div>
</div>
<!-- @include ds/theme-follow.html -->
</body>
</html>
