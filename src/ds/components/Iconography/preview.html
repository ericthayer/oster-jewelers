<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Iconography</title>
<style>
  .pv { display: flex; flex-direction: column; gap: var(--space-6); padding: var(--space-6); }
  .pv__set { display: grid; gap: var(--space-2); grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); list-style: none; margin: 0; padding: 0; }
  .pv__set li { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); padding: var(--space-4) var(--space-2); font-size: var(--fs-body-sm); color: var(--text-muted); text-align: center; border: 1px solid var(--border); border-radius: var(--radius-card); }
  .pv__set .tpl-icon { width: 2rem; height: 2rem; color: var(--text); }
  .pv__set--services .tpl-icon { color: var(--accent-text); }
  .pv h2 { font-size: var(--fs-label); font-weight: 700; }
</style>
</head>
<body>
<div class="pv">
  <h2>Services</h2>
  <ul class="pv__set pv__set--services" role="list">
    <li><svg class="tpl-icon" data-tpl-icon="plug-connected"></svg>Service one</li>
    <li><svg class="tpl-icon" data-tpl-icon="backhoe"></svg>Service two</li>
    <li><svg class="tpl-icon" data-tpl-icon="crane"></svg>Service three</li>
    <li><svg class="tpl-icon" data-tpl-icon="building-broadcast-tower"></svg>Service four</li>
    <li><svg class="tpl-icon" data-tpl-icon="road"></svg>Service five</li>
    <li><svg class="tpl-icon" data-tpl-icon="shield-check"></svg>Safety</li>
  </ul>
  <h2>Interface</h2>
  <ul class="pv__set" role="list">
    <li><svg class="tpl-icon" data-tpl-icon="phone"></svg>phone</li>
    <li><svg class="tpl-icon" data-tpl-icon="mail"></svg>mail</li>
    <li><svg class="tpl-icon" data-tpl-icon="map-pin"></svg>map-pin</li>
    <li><svg class="tpl-icon" data-tpl-icon="arrow-right"></svg>arrow-right</li>
    <li><svg class="tpl-icon" data-tpl-icon="arrow-up-right"></svg>arrow-up-right</li>
    <li><svg class="tpl-icon" data-tpl-icon="menu-2"></svg>menu-2</li>
    <li><svg class="tpl-icon" data-tpl-icon="circle-check"></svg>circle-check</li>
    <li><svg class="tpl-icon" data-tpl-icon="alert-triangle"></svg>alert-triangle</li>
    <li><svg class="tpl-icon" data-tpl-icon="file-upload"></svg>file-upload</li>
    <li><svg class="tpl-icon" data-tpl-icon="users-group"></svg>users-group</li>
  </ul>
</div>
</body>
</html>
