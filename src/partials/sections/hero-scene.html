<section class="tpl-hero tpl-hero--scene" aria-labelledby="{{id|hero-title}}">
  <div class="tpl-hero__scene" data-tpl-scene aria-hidden="true"></div>
  <div class="tpl-container tpl-hero__inner">
    <div class="tpl-hero__content">
      <span class="tpl-eyebrow">Category line</span>
      <h1 class="tpl-display" id="{{id|hero-title}}" data-tpl-words>A headline that moves.</h1>
      <p class="tpl-lead">One line on what the client delivers and why it matters to the buyer.</p>
      <div class="tpl-hero__actions">
        <a class="tpl-btn tpl-btn--primary tpl-btn--lg tpl-btn--orb" href="{{base|}}contact.html#quote" data-tpl-magnetic>Request a quote<svg class="tpl-icon tpl-icon--trail" data-tpl-icon="arrow-up-right"></svg></a>
        <a class="tpl-btn tpl-btn--secondary tpl-btn--lg" href="{{services|#services}}" data-tpl-magnetic>Our services</a>
      </div>
    </div>
  </div>
</section>
