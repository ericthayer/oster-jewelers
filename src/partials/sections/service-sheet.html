<dialog class="tpl-sheet" id="{{id|service-sheet}}" aria-labelledby="{{id|service-sheet}}-title">
  <div class="tpl-sheet__panel tpl-shell">
    <button class="tpl-sheet__close" type="button" autofocus data-tpl-sheet-close><svg class="tpl-icon" data-tpl-icon="x"></svg><span class="tpl-visually-hidden">Close</span></button>
    <div class="tpl-sheet__media" data-tpl-sheet-media></div>
    <div class="tpl-sheet__body">
      <span class="tpl-sheet__index" data-tpl-sheet-index></span>
      <h2 class="tpl-h2" id="{{id|service-sheet}}-title" data-tpl-sheet-title>Service</h2>
      <p class="tpl-lead tpl-muted" data-tpl-sheet-desc></p>
      <ul class="tpl-checks" role="list" data-tpl-sheet-scope></ul>
      <div class="tpl-hero__actions">
        <a class="tpl-btn tpl-btn--primary tpl-btn--orb" href="{{base|}}contact.html#quote">Request a quote<svg class="tpl-icon tpl-icon--trail" data-tpl-icon="arrow-up-right"></svg></a>
        <a class="tpl-arrow-link" href="{{base|}}services.html" data-tpl-sheet-link>Our services<svg class="tpl-icon" data-tpl-icon="arrow-right"></svg></a>
      </div>
    </div>
  </div>
</dialog>
